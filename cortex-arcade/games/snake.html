<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="../assets/logo.svg">
<title>Neon Snake</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #07060b; color: #fff; font-family: Inter, system-ui, sans-serif; overflow: hidden; }
  .app { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 10px; }
  .hud { display: flex; gap: 22px; font-size: 13px; letter-spacing: .1em; color: #b9b2c6; text-transform: uppercase; }
  .hud b { color: #ff86c4; font-size: 16px; letter-spacing: 0; margin-left: 6px; }
  .board { position: relative; }
  canvas { display: block; background: #0d0b13; border-radius: 16px; box-shadow: 0 0 0 1px #ffffff1f, 0 0 50px #ff3d9f33; touch-action: none; }
  .overlay { position: absolute; inset: 0; display: grid; place-items: center; background: #07060bcc; border-radius: 16px; text-align: center; padding: 18px; backdrop-filter: blur(4px); }
  .overlay[hidden] { display: none; }
  .overlay h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: -.03em; }
  .overlay p { margin: 0 0 14px; color: #aaa2b8; font-size: 13px; line-height: 1.5; }
  button { border: 0; background: #ff3d9f; color: #fff; font: inherit; font-weight: 700; padding: 11px 18px; border-radius: 12px; cursor: pointer; }
  button:hover { filter: brightness(1.08); }
  .hint { font-size: 11px; color: #6f6880; }
</style>
</head>
<body>
<div class="app">
  <div class="hud"><span>Score<b id="score">0</b></span><span>Best<b id="best">0</b></span></div>
  <div class="board">
    <canvas id="board" width="480" height="480" aria-label="Snake board"></canvas>
    <div class="overlay" id="overlay">
      <div>
        <h1 id="ovTitle">Neon Snake</h1>
        <p id="ovText">Steer with arrows or WASD. Swipe on touch.<br>Space pauses, R restarts.</p>
        <button id="startBtn" type="button">Play</button>
      </div>
    </div>
  </div>
  <div class="hint">Eat the dots. Don’t bite your tail.</div>
</div>
<script>
(function () {
  'use strict';
  var COLS = 24, CELL = 20;
  var canvas = document.getElementById('board');
  var ctx = canvas.getContext('2d');
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var overlay = document.getElementById('overlay');
  var ovTitle = document.getElementById('ovTitle');
  var ovText = document.getElementById('ovText');
  var startBtn = document.getElementById('startBtn');

  var snake, dir, nextDir, food, score, best, tickMs, timer, running, paused, alive;

  function readBest() { try { return Number(localStorage.getItem('cx_snake_best') || 0); } catch (e) { return 0; } }
  function writeBest(v) { try { localStorage.setItem('cx_snake_best', String(v)); } catch (e) { /* ignore */ } }

  best = readBest();
  bestEl.textContent = best;

  function reset() {
    snake = [{ x: 11, y: 12 }, { x: 10, y: 12 }, { x: 9, y: 12 }];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    tickMs = 130;
    alive = true;
    paused = false;
    scoreEl.textContent = '0';
    placeFood();
    draw();
  }

  function placeFood() {
    var free = [];
    for (var y = 0; y < COLS; y++) {
      for (var x = 0; x < COLS; x++) {
        var hit = snake.some(function (s) { return s.x === x && s.y === y; });
        if (!hit) free.push({ x: x, y: y });
      }
    }
    food = free[Math.floor(Math.random() * free.length)] || { x: 0, y: 0 };
  }

  function step() {
    if (!running || paused) return;
    if (nextDir.x !== -dir.x || nextDir.y !== -dir.y) dir = nextDir;
    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= COLS) return gameOver();
    for (var i = 0; i < snake.length - 1; i++) {
      if (snake[i].x === head.x && snake[i].y === head.y) return gameOver();
    }
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = String(score);
      tickMs = Math.max(62, tickMs - 3);
      clearInterval(timer);
      timer = setInterval(step, tickMs);
      placeFood();
    } else {
      snake.pop();
    }
    draw();
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#0d0b13';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = 'rgba(255,255,255,.04)';
    for (var i = 1; i < COLS; i++) {
      ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(canvas.width, i * CELL); ctx.stroke();
    }
    ctx.fillStyle = '#ff3d9f';
    ctx.shadowColor = '#ff3d9f';
    ctx.shadowBlur = 16;
    ctx.beginPath();
    ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    for (var j = snake.length - 1; j >= 0; j--) {
      var seg = snake[j];
      var t = 1 - j / (snake.length + 2);
      ctx.fillStyle = 'rgba(255,' + Math.round(134 - t * 60) + ',' + Math.round(196 - t * 120) + ',' + (0.45 + t * 0.55) + ')';
      roundRect(seg.x * CELL + 2, seg.y * CELL + 2, CELL - 4, CELL - 4, 6);
    }
    var head = snake[0];
    ctx.fillStyle = '#ffffff';
    roundRect(head.x * CELL + 4, head.y * CELL + 4, CELL - 8, CELL - 8, 6);
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    ctx.fill();
  }

  function gameOver() {
    alive = false;
    running = false;
    clearInterval(timer);
    if (score > best) { best = score; writeBest(best); bestEl.textContent = best; }
    ovTitle.textContent = 'Game over';
    ovText.innerHTML = 'Score ' + score + (score >= best && score > 0 ? ' — new best!' : '') + '<br>Space or the button to go again.';
    startBtn.textContent = 'Play again';
    overlay.hidden = false;
  }

  function togglePause() {
    if (!running || !alive) return;
    paused = !paused;
    if (paused) {
      ovTitle.textContent = 'Paused';
      ovText.textContent = 'Space to resume.';
      startBtn.textContent = 'Resume';
      overlay.hidden = false;
    } else {
      overlay.hidden = true;
    }
  }

  function start() {
    if (!alive) reset();
    overlay.hidden = true;
    running = true;
    paused = false;
    clearInterval(timer);
    timer = setInterval(step, tickMs);
    canvas.focus();
  }

  var KEYS = {
    ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
    w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0], W: [0, -1], S: [0, 1], A: [-1, 0], D: [1, 0]
  };

  document.addEventListener('keydown', function (e) {
    if (KEYS[e.key]) {
      e.preventDefault();
      var v = KEYS[e.key];
      if (running && !paused) nextDir = { x: v[0], y: v[1] };
    } else if (e.key === ' ') {
      e.preventDefault();
      if (!running) start(); else togglePause();
    } else if (e.key === 'r' || e.key === 'R') {
      reset(); start();
    }
  });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) togglePause();
  });

  var touchStart = null;
  canvas.addEventListener('touchstart', function (e) {
    var t = e.changedTouches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });
  canvas.addEventListener('touchend', function (e) {
    if (!touchStart) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
    if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) nextDir = { x: dx > 0 ? 1 : -1, y: 0 };
    else nextDir = { x: 0, y: dy > 0 ? 1 : -1 };
    touchStart = null;
  }, { passive: true });

  startBtn.addEventListener('click', function () {
    if (running && paused) togglePause(); else start();
  });

  function fitBoard() {
    var max = Math.min(window.innerWidth - 32, window.innerHeight - 150, 560);
    var size = Math.max(240, Math.floor(max / COLS) * COLS);
    canvas.style.width = size + 'px';
    canvas.style.height = size + 'px';
  }
  window.addEventListener('resize', fitBoard);
  fitBoard();
  reset();
  overlay.hidden = false;
  running = false;
})();
</script>
</body>
</html>
