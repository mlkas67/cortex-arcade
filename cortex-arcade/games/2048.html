<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="../assets/logo.svg">
<title>2048</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #07060b; color: #fff; font-family: Inter, system-ui, sans-serif; overflow: hidden; }
  .app { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 12px; }
  .top { width: 100%; max-width: 460px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .scores { display: flex; gap: 8px; }
  .score { background: #14121c; border: 1px solid #ffffff1f; border-radius: 12px; padding: 7px 14px; text-align: center; }
  .score span { display: block; font-size: 10px; letter-spacing: .12em; color: #8d86a0; }
  .score b { font-size: 19px; }
  .btns { display: flex; gap: 8px; }
  button { border: 0; border-radius: 11px; font: inherit; font-size: 13px; font-weight: 700; padding: 10px 15px; cursor: pointer; background: #ff3d9f; color: #fff; }
  button.ghost { background: #1b1824; color: #ddd6e8; border: 1px solid #ffffff1f; }
  button:hover { filter: brightness(1.1); }
  .board-wrap { position: relative; }
  .board { width: min(92vw, 460px); aspect-ratio: 1; background: #14121c; border-radius: 18px; padding: 10px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; box-shadow: 0 0 0 1px #ffffff1a, 0 0 60px #ff3d9f26; touch-action: none; }
  .cell { border-radius: 11px; background: #0e0c14; display: grid; place-items: center; font-weight: 800; font-size: clamp(18px, 6vw, 34px); color: #2b2739; transition: background .12s, color .12s; }
  .cell[data-v="2"] { background: #241f33; color: #e7e0f5; }
  .cell[data-v="4"] { background: #2e2643; color: #eee7fb; }
  .cell[data-v="8"] { background: #5c2a86; color: #fff; }
  .cell[data-v="16"] { background: #7c2fa8; color: #fff; }
  .cell[data-v="32"] { background: #a42a96; color: #fff; }
  .cell[data-v="64"] { background: #d1298c; color: #fff; }
  .cell[data-v="128"] { background: #ff3d9f; color: #fff; font-size: clamp(16px, 5vw, 29px); }
  .cell[data-v="256"] { background: #ff5fb0; color: #fff; font-size: clamp(16px, 5vw, 29px); }
  .cell[data-v="512"] { background: #ff86c4; color: #2a0a1c; font-size: clamp(16px, 5vw, 29px); }
  .cell[data-v="1024"] { background: #ffc0e0; color: #2a0a1c; font-size: clamp(13px, 4vw, 23px); }
  .cell[data-v="2048"] { background: #fff; color: #8c2dff; font-size: clamp(13px, 4vw, 23px); box-shadow: 0 0 30px #fff8; }
  .cell.pop { animation: pop .16s ease-out; }
  @keyframes pop { from { transform: scale(.86); } to { transform: scale(1); } }
  .overlay { position: absolute; inset: 0; display: grid; place-items: center; border-radius: 18px; background: #07060bd9; backdrop-filter: blur(3px); text-align: center; padding: 20px; }
  .overlay[hidden] { display: none; }
  .overlay h1 { margin: 0 0 6px; font-size: 28px; }
  .overlay p { color: #aaa2b8; margin: 0 0 16px; font-size: 14px; }
  .hint { color: #6f6880; font-size: 11px; }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="scores">
      <div class="score"><span>SCORE</span><b id="score">0</b></div>
      <div class="score"><span>BEST</span><b id="best">0</b></div>
    </div>
    <div class="btns"><button class="ghost" id="undo" type="button">Undo</button><button id="newGame" type="button">New game</button></div>
  </div>
  <div class="board-wrap">
    <div class="board" id="board" aria-label="2048 board"></div>
    <div class="overlay" id="overlay" hidden><div><h1 id="ovTitle">You win!</h1><p id="ovText">2048 reached.</p><button id="ovBtn" type="button">Keep going</button></div></div>
  </div>
  <div class="hint">Arrows, WASD or swipe. U undoes a move. R restarts.</div>
</div>
<script>
(function () {
  'use strict';
  var boardEl = document.getElementById('board');
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var overlay = document.getElementById('overlay');
  var ovTitle = document.getElementById('ovTitle');
  var ovText = document.getElementById('ovText');
  var ovBtn = document.getElementById('ovBtn');
  var size = 4;
  var grid, score, best, previous, won, locked;

  function readBest() { try { return Number(localStorage.getItem('cx_2048_best') || 0); } catch (e) { return 0; } }
  function writeBest(v) { try { localStorage.setItem('cx_2048_best', String(v)); } catch (e) { /* ignore */ } }

  best = readBest();
  bestEl.textContent = best;

  function emptyGrid() {
    var g = [];
    for (var y = 0; y < size; y++) { g.push([]); for (var x = 0; x < size; x++) g[y].push(0); }
    return g;
  }

  function addTile() {
    var free = [];
    for (var y = 0; y < size; y++) for (var x = 0; x < size; x++) if (!grid[y][x]) free.push([y, x]);
    if (!free.length) return;
    var pick = free[Math.floor(Math.random() * free.length)];
    grid[pick[0]][pick[1]] = Math.random() < 0.9 ? 2 : 4;
  }

  function start() {
    grid = emptyGrid();
    score = 0;
    previous = null;
    won = false;
    locked = false;
    overlay.hidden = true;
    addTile(); addTile();
    render();
  }

  function render() {
    boardEl.innerHTML = '';
    for (var y = 0; y < size; y++) {
      for (var x = 0; x < size; x++) {
        var v = grid[y][x];
        var cell = document.createElement('div');
        cell.className = 'cell' + (v ? ' pop' : '');
        cell.dataset.v = String(v);
        cell.textContent = v ? String(v) : '';
        boardEl.appendChild(cell);
      }
    }
    scoreEl.textContent = String(score);
    if (score > best) { best = score; writeBest(best); }
    bestEl.textContent = String(best);
  }

  function slideLine(line) {
    var nums = line.filter(function (v) { return v; });
    var out = [];
    var gained = 0;
    for (var i = 0; i < nums.length; i++) {
      if (nums[i] === nums[i + 1]) {
        var merged = nums[i] * 2;
        out.push(merged);
        gained += merged;
        if (merged === 2048) won = true;
        i++;
      } else out.push(nums[i]);
    }
    while (out.length < size) out.push(0);
    return { line: out, gained: gained };
  }

  function clone(g) { return g.map(function (row) { return row.slice(); }); }

  function move(dirName) {
    if (locked) return;
    var before = clone(grid);
    var gainedTotal = 0;
    var moved = false;
    for (var i = 0; i < size; i++) {
      var line;
      if (dirName === 'left') line = grid[i].slice();
      else if (dirName === 'right') line = grid[i].slice().reverse();
      else if (dirName === 'up') line = grid.map(function (row) { return row[i]; });
      else line = grid.map(function (row) { return row[i]; }).reverse();

      var res = slideLine(line);
      gainedTotal += res.gained;
      var out = res.line;
      if (dirName === 'right') out = out.slice().reverse();
      if (dirName === 'up' || dirName === 'down') {
        for (var y = 0; y < size; y++) grid[y][i] = out[y];
      } else {
        grid[i] = out;
      }
    }
    for (var y2 = 0; y2 < size; y2++) for (var x2 = 0; x2 < size; x2++) if (grid[y2][x2] !== before[y2][x2]) moved = true;
    if (!moved) return;
    previous = { grid: before, score: score };
    score += gainedTotal;
    addTile();
    render();
    if (won) {
      won = false;
      locked = true;
      ovTitle.textContent = 'You win!';
      ovText.textContent = 'You reached 2048 with ' + score + ' points.';
      ovBtn.textContent = 'Keep going';
      overlay.hidden = false;
      return;
    }
    if (!canMove()) {
      locked = true;
      ovTitle.textContent = 'No moves left';
      ovText.textContent = 'Final score ' + score + '.';
      ovBtn.textContent = 'Try again';
      overlay.hidden = false;
    }
  }

  function canMove() {
    for (var y = 0; y < size; y++) {
      for (var x = 0; x < size; x++) {
        if (!grid[y][x]) return true;
        if (x + 1 < size && grid[y][x] === grid[y][x + 1]) return true;
        if (y + 1 < size && grid[y][x] === grid[y + 1][x]) return true;
      }
    }
    return false;
  }

  function undo() {
    if (!previous) return;
    grid = previous.grid;
    score = previous.score;
    previous = null;
    locked = false;
    overlay.hidden = true;
    render();
  }

  ovBtn.addEventListener('click', function () {
    if (ovTitle.textContent === 'No moves left') { start(); return; }
    locked = false;
    overlay.hidden = true;
  });

  document.getElementById('newGame').addEventListener('click', start);
  document.getElementById('undo').addEventListener('click', undo);

  document.addEventListener('keydown', function (e) {
    var map = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down', a: 'left', d: 'right', w: 'up', s: 'down' };
    if (map[e.key]) { e.preventDefault(); move(map[e.key]); }
    else if (e.key === 'u' || e.key === 'U') undo();
    else if (e.key === 'r' || e.key === 'R') start();
  });

  var touch = null;
  boardEl.addEventListener('touchstart', function (e) { var t = e.changedTouches[0]; touch = { x: t.clientX, y: t.clientY }; }, { passive: true });
  boardEl.addEventListener('touchend', function (e) {
    if (!touch) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - touch.x, dy = t.clientY - touch.y;
    touch = null;
    if (Math.abs(dx) < 26 && Math.abs(dy) < 26) return;
    move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  }, { passive: true });

  start();
})();
</script>
</body>
</html>
